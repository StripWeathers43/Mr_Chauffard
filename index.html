<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chauffard Simulator - Freins et Audio Corrigés</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #game-ui {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between;
        }

        #menu-bg-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 150;
            pointer-events: none;
        }

        .flash-overlay {
            position: absolute; top: 0; height: 100vh;
            background: #fff; pointer-events: none; z-index: 80;
            opacity: 0; 
        }
        #flash-p1 { left: 0; width: 100vw; }
        #flash-p2 { left: 50vw; width: 50vw; }

        #split-line {
            position: absolute; top: 0; left: 50%; width: 4px; height: 100vh;
            background: #222; transform: translateX(-50%); z-index: 85;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        #countdown-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.5); z-index: 100;
        }
        #countdown-text {
            font-size: 15rem; color: white; margin: 0;
            text-shadow: 0 0 30px #e74c3c;
        }

        .mirror-frame {
            position: absolute; top: 20px; border: 4px solid #222; border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.2);
            background: transparent; pointer-events: none; z-index: 95;
            transform: translateX(-50%);
        }

        /* --- HUD CIRCULAIRE FORZA --- */
        .circular-hud {
            position: absolute;
            bottom: 40px;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            border-radius: 50%;
            border: 4px solid #222;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
            z-index: 90;
            transition: right 0.3s;
        }

        .hud-track {
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border-radius: 50%;
            background: conic-gradient(from 225deg, 
                #3498db 0deg, 
                #2ecc71 121.5deg, 
                #f1c40f 202.5deg, 
                #e74c3c 236.25deg, 
                #c0392b 270deg, 
                transparent 270deg
            );
            -webkit-mask: radial-gradient(circle, transparent 63%, black 64%);
            mask: radial-gradient(circle, transparent 63%, black 64%);
        }

        .rpm-labels span {
            position: absolute;
            font-size: 1.1rem;
            font-weight: 900;
            color: #ccc;
            transform: translate(-50%, -50%);
            text-shadow: 1px 1px 2px #000;
        }
        
        .rpm-0 { top: 75%; left: 25%; }
        .rpm-1 { top: 57%; left: 15%; }
        .rpm-2 { top: 36%; left: 17%; }
        .rpm-3 { top: 20%; left: 30%; }
        .rpm-4 { top: 14%; left: 50%; }
        .rpm-5 { top: 20%; left: 70%; }
        .rpm-6 { top: 36%; left: 83%; }
        .rpm-7 { top: 57%; left: 85%; color: #e74c3c !important; }
        .rpm-8 { top: 75%; left: 75%; color: #e74c3c !important; }

        .hud-needle {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 4px;
            height: 85px;
            background: #e74c3c;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-135deg); 
            border-radius: 2px 2px 0 0;
            box-shadow: 0 0 6px #e74c3c;
            transition: transform 0.05s linear;
            z-index: 2;
        }
        .hud-needle::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: -6px;
            width: 16px;
            height: 16px;
            background: #111;
            border: 2px solid #555;
            border-radius: 50%;
        }

        .hud-center-info {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 1;
        }
        .hud-speed-val {
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 0.8;
            text-shadow: 2px 2px 4px #000;
            font-style: italic;
        }
        .hud-speed-unit {
            font-size: 0.9rem;
            color: #aaa;
            font-weight: bold;
            margin-top: 2px;
        }
        .hud-gear-val {
            font-size: 1.8rem;
            font-weight: 900;
            margin-top: 5px;
            text-shadow: 1px 1px 3px #000;
            font-style: italic;
        }
        
        .hud-score-display {
            position: absolute;
            bottom: -35px;
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            padding: 2px 0;
        }

        .menu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 15, 20, 0.65); 
            padding: 30px 50px; border-radius: 5px;
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            pointer-events: auto; width: 450px; z-index: 200;
            backdrop-filter: blur(3px); 
        }

        h1 { color: #fff; font-size: 2.5rem; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #aaa; font-size: 1rem; margin-bottom: 20px; }
        
        .controls-info { font-size: 0.85rem; color: #3498db; margin-bottom: 20px; font-weight: bold; line-height: 1.5; }

        .color-pickers-container { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
        .color-picker { flex: 1; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 5px; border: 1px solid #444; }
        .color-picker p { font-size: 0.85rem; margin-bottom: 10px; color: #fff; font-weight: bold; }
        
        .name-input {
            width: 80%;
            padding: 6px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #555;
            color: #fff;
            border-radius: 3px;
            text-align: center;
            font-weight: bold;
            font-family: inherit;
        }
        .name-input:focus { outline: none; border-color: #3498db; }

        .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; justify-items: center; }
        .swatch {
            width: 25px; height: 25px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: 0.2s;
        }
        .swatch:hover { transform: scale(1.1); }
        .swatch.selected { border: 3px solid #fff; transform: scale(1.2); box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        .sliders-container {
            background: rgba(0,0,0,0.4); padding: 15px; border-radius: 5px; margin-bottom: 25px; text-align: left;
            border: 1px solid #444;
        }
        .slider-group { display: flex; flex-direction: column; margin-bottom: 12px; }
        .slider-group:last-child { margin-bottom: 0; }
        .slider-group label { color: #fff; font-size: 0.85rem; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .slider-group input { width: 100%; cursor: pointer; accent-color: #e74c3c; }

        .btn-container { display: flex; gap: 10px; }
        button.start-btn {
            padding: 15px 0; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            border: none; border-radius: 3px; text-transform: uppercase; transition: 0.2s; color: white;
            flex: 1; box-shadow: 0 4px 0 rgba(0,0,0,0.5);
        }
        .btn-1p { background-color: #27ae60; }
        .btn-2p { background-color: #d35400; }
        button.start-btn:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0,0,0,0.5); }
        button.start-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.5); }
        
        .btn-restart { background-color: #7f8c8d; width: 100%; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; cursor: pointer; border: none; border-radius: 3px; color: white; transition: 0.2s; box-shadow: 0 4px 0 rgba(0,0,0,0.5);}
        .btn-restart:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0,0,0,0.5); }
        .btn-restart:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.5); }
        
        .hidden { display: none !important; }
        
        #error-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15,0,0,0.9); color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            font-family: sans-serif; text-align: center; padding: 20px;
        }
        #error-overlay h1 { color: #e74c3c; font-size: 3rem; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-ui">
        <div id="menu-bg-overlay"></div>
        <div id="countdown-overlay" class="hidden"><h1 id="countdown-text">3</h1></div>
        <div id="split-line" class="hidden"></div>
        <div id="flash-p1" class="flash-overlay"></div>
        <div id="flash-p2" class="flash-overlay hidden"></div>
        
        <div id="mirror-p1" class="mirror-frame hidden"></div>
        <div id="mirror-p2" class="mirror-frame hidden"></div>
        
        <!-- COMPTEUR J1 -->
        <div id="hud-p1" class="circular-hud hidden">
            <div class="hud-track"></div>
            <div class="rpm-labels">
                <span class="rpm-0">0</span>
                <span class="rpm-1">1</span>
                <span class="rpm-2">2</span>
                <span class="rpm-3">3</span>
                <span class="rpm-4">4</span>
                <span class="rpm-5">5</span>
                <span class="rpm-6">6</span>
                <span class="rpm-7">7</span>
                <span class="rpm-8">8</span>
            </div>
            <div class="hud-needle" id="needle-p1"></div>
            <div class="hud-center-info">
                <div class="hud-speed-val" id="speed-p1">0</div>
                <div class="hud-speed-unit">KM/H</div>
                <div class="hud-gear-val" style="color: #e74c3c;">V<span id="gear-p1">1</span></div>
            </div>
            <div class="hud-score-display" style="color: #e74c3c;"><span id="label-p1">J1</span> : <span id="score-p1" style="color: white;">0</span> pts</div>
        </div>

        <!-- COMPTEUR J2 -->
        <div id="hud-p2" class="circular-hud hidden">
            <div class="hud-track"></div>
            <div class="rpm-labels">
                <span class="rpm-0">0</span>
                <span class="rpm-1">1</span>
                <span class="rpm-2">2</span>
                <span class="rpm-3">3</span>
                <span class="rpm-4">4</span>
                <span class="rpm-5">5</span>
                <span class="rpm-6">6</span>
                <span class="rpm-7">7</span>
                <span class="rpm-8">8</span>
            </div>
            <div class="hud-needle" id="needle-p2"></div>
            <div class="hud-center-info">
                <div class="hud-speed-val" id="speed-p2">0</div>
                <div class="hud-speed-unit">KM/H</div>
                <div class="hud-gear-val" style="color: #3498db;">V<span id="gear-p2">1</span></div>
            </div>
            <div class="hud-score-display" style="color: #3498db;"><span id="label-p2">J2</span> : <span id="score-p2" style="color: white;">0</span> pts</div>
        </div>

        <div id="start-menu" class="menu">
            <h1>Mr Chauffard</h1>
            <p>Les appels de phares c'est cool !</p>
            
            <div class="color-pickers-container">
                <div class="color-picker">
                    <input type="text" id="input-name-p1" class="name-input" placeholder="Nom J1" value="Joueur 1" maxlength="15">
                    <p>Couleur J1</p>
                    <div class="swatches" id="swatches-p1">
                        <div class="swatch selected" style="background: #e74c3c" onclick="selectColor(this, '#e74c3c', 1)"></div>
                        <div class="swatch" style="background: #3498db" onclick="selectColor(this, '#3498db', 1)"></div>
                        <div class="swatch" style="background: #2ecc71" onclick="selectColor(this, '#2ecc71', 1)"></div>
                        <div class="swatch" style="background: #f1c40f" onclick="selectColor(this, '#f1c40f', 1)"></div>
                        <div class="swatch" style="background: #ecf0f1" onclick="selectColor(this, '#ecf0f1', 1)"></div>
                        <div class="swatch" style="background: #222222" onclick="selectColor(this, '#222222', 1)"></div>
                    </div>
                </div>
                <div class="color-picker">
                    <input type="text" id="input-name-p2" class="name-input" placeholder="Nom J2" value="Joueur 2" maxlength="15">
                    <p>Couleur J2</p>
                    <div class="swatches" id="swatches-p2">
                        <div class="swatch" style="background: #e74c3c" onclick="selectColor(this, '#e74c3c', 2)"></div>
                        <div class="swatch selected" style="background: #3498db" onclick="selectColor(this, '#3498db', 2)"></div>
                        <div class="swatch" style="background: #2ecc71" onclick="selectColor(this, '#2ecc71', 2)"></div>
                        <div class="swatch" style="background: #f1c40f" onclick="selectColor(this, '#f1c40f', 2)"></div>
                        <div class="swatch" style="background: #ecf0f1" onclick="selectColor(this, '#ecf0f1', 2)"></div>
                        <div class="swatch" style="background: #222222" onclick="selectColor(this, '#222222', 2)"></div>
                    </div>
                </div>
            </div>

            <div class="sliders-container">
                <div class="slider-group">
                    <label>Maniabilité <span id="val-handling">60</span></label>
                    <input type="range" id="slider-handling" min="0" max="100" value="60" oninput="document.getElementById('val-handling').innerText = this.value">
                </div>
                <div class="slider-group">
                    <label>Accélération <span id="val-accel">50</span></label>
                    <input type="range" id="slider-accel" min="0" max="100" value="50" oninput="document.getElementById('val-accel').innerText = this.value">
                </div>
                <div class="slider-group">
                    <label>Freinage <span id="val-brake">60</span></label>
                    <input type="range" id="slider-brake" min="0" max="100" value="60" oninput="document.getElementById('val-brake').innerText = this.value">
                </div>
                <div class="slider-group">
                    <label>Densité trafic <span id="val-traffic">20</span></label>
                    <input type="range" id="slider-traffic" min="0" max="40" value="20" oninput="document.getElementById('val-traffic').innerText = this.value; updateMenuTraffic();">
                </div>
                <div class="slider-group">
                    <label>Puissance collisions <span id="val-collision">80</span></label>
                    <input type="range" id="slider-collision" min="0" max="100" value="80" oninput="document.getElementById('val-collision').innerText = this.value">
                </div>
            </div>

            <div class="controls-info">
                J1 : ZQSD / <b>Shift</b> (Phares) / <b>T</b> (Descendre) / <b>Y</b> (Monter)<br>
                J2 : ↑←↓→ / <b>0</b> (Phares) / <b>1</b> (Descendre) / <b>2</b> (Monter)
            </div>
            
            <div class="btn-container">
                <button class="start-btn btn-1p" onclick="startGame(1)">1 Joueur</button>
                <button class="start-btn btn-2p" onclick="startGame(2)">2 Joueurs</button>
            </div>
        </div>

        <div id="game-over-menu" class="menu hidden">
            <h1 id="game-over-title" style="color: #e74c3c;">CRASH !</h1>
            <p id="game-over-desc">SCORE FINAL : <span id="final-score" style="color: #fff; font-weight: bold;">0</span></p>
            <button class="btn-restart" onclick="returnToMenu()">RETOUR AU MENU</button>
        </div>
    </div>

    <script>
        window.addEventListener('error', function(e) {
            document.body.innerHTML += `
                <div id="error-overlay">
                    <h1>ERREUR FATALE</h1>
                    <p>${e.message}</p>
                    <p style="font-size: 0.9rem;">Ligne : ${e.lineno}</p>
                </div>`;
        });

        // --- GESTION AUDIO CORRIGÉE ---
        function createPlayerSounds() {
            let engine = new Audio('moteur.wav'); 
            engine.loop = true; 
            engine.volume = 0.4;
            engine.preservesPitch = false;
            engine.mozPreservesPitch = false;
            engine.webkitPreservesPitch = false;

            let revlimit = new Audio('rupteur.wav'); 
            revlimit.loop = true; // Permet de boucler si tu restes à fond
            revlimit.volume = 0.6;

            let up = new Audio('upshift.wav'); up.volume = 0.8;
            let down = new Audio('downshift.wav'); down.volume = 0.8;
            let crash = new Audio('crash.wav'); crash.volume = 1.0;
            let backfire = new Audio('backfire.wav'); backfire.volume = 0.8; // <-- NOUVEAU
            return { engine, revlimit, up, down, crash, backfire }; // <-- MISE À JOUR
        }
        
        const soundWhoosh = new Audio('whoosh.wav'); soundWhoosh.volume = 0.6;

        const GEAR_LIMITS = { 1: 60, 2: 105, 3: 155, 4: 198, 5: 255, 6: 315 };
        const GEAR_ACCEL = { 1: 120, 2: 80, 3: 55, 4: 40, 5: 25, 6: 15 };

        const CONFIG = {
            LANE_COUNT: 3,          
            LANE_WIDTH: 6,          
            ROAD_LENGTH: 600,       
            SPEED_MULTIPLIER: 0.35, 
            MAX_KMH: 399,
            TRAFFIC_WIDTH: 3.5,
            TRAFFIC_LENGTH: 5,
            TRAFFIC_MIN_KMH: 100,    
            TRAFFIC_MAX_KMH: 150,   
            SAFE_DISTANCE: 45,      
            LANE_MARGIN: 40,        
            CHANGE_LANE_SPEED: 3.5, 
            BLINKER_DELAY: 1.0,     
            COOLDOWN_DELAY: 3.0,
            MAX_SEPARATION: 550,    
            COLORS: [0xe74c3c, 0x3498db, 0x2ecc71, 0x9b59b6, 0xf1c40f, 0xbdc3c7, 0xffffff, 0x222222]
        };

        const DECOR = {
            lightSpacing: 60,
            lightCount: 20,
            treeCount: 80,
            buildingCount: 60, 
            mountainCount: 40
        };

        const LANE_CENTERS = [];
        const TOTAL_ROAD_WIDTH = CONFIG.LANE_COUNT * CONFIG.LANE_WIDTH;
        for (let i = 0; i < CONFIG.LANE_COUNT; i++) {
            LANE_CENTERS.push(-TOTAL_ROAD_WIDTH / 2 + (CONFIG.LANE_WIDTH / 2) + (i * CONFIG.LANE_WIDTH));
        }

        let scene, camera1, camera2, rearCamera1, rearCamera2, menuCamera, renderer;
        let ground, road, dirLight, ambientLight, streetLightMat; 
        let trafficArray = [], roadLines = [];
        let lightsLeft = [], lightsRight = [], trees = [], mountains = [], buildings = []; 
        
        let tunnelGroup;
        let currentTunnelZ = 1000; 
        let currentTunnelLength = 0;

        let gameState = 'menu'; 
        let numPlayers = 1;
        let countdownTimer = 3.0;
        
        let playerColor1 = '#e74c3c'; 
        let playerColor2 = '#3498db'; 
        let configHandling = 60, configAccel = 50, configBrake = 60, configTraffic = 20, configCollision = 80;

        let p1 = { isDead: true }, p2 = { isDead: true };
        const keys = {};

        const startMenu = document.getElementById('start-menu');
        const gameOverMenu = document.getElementById('game-over-menu');
        const countdownOverlay = document.getElementById('countdown-overlay');
        const menuBgOverlay = document.getElementById('menu-bg-overlay');
        const mirror1 = document.getElementById('mirror-p1');
        const mirror2 = document.getElementById('mirror-p2');
        const flashP1 = document.getElementById('flash-p1');
        const flashP2 = document.getElementById('flash-p2');

        function selectColor(element, color, player) {
            document.querySelectorAll(`#swatches-p${player} .swatch`).forEach(s => s.classList.remove('selected'));
            element.classList.add('selected');
            if(player === 1) playerColor1 = color;
            else playerColor2 = color;
        }

        window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

        function createSharedBuildingMat() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2c3e50'; 
            ctx.fillRect(0, 0, 128, 128); 
            ctx.fillStyle = '#f1c40f'; 
            for(let x=10; x<128; x+=30) {
                for(let y=10; y<128; y+=30) {
                    if(Math.random() > 0.5) ctx.fillRect(x, y, 10, 15);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 4); 
            return new THREE.MeshLambertMaterial({ map: tex });
        }

        function init() {
            if (typeof THREE === 'undefined') throw new Error("Moteur THREE introuvable");

            document.getElementById('slider-handling').value = 60;
            document.getElementById('val-handling').innerText = "60";
            document.getElementById('slider-accel').value = 50;
            document.getElementById('val-accel').innerText = "50";
            document.getElementById('slider-brake').value = 60;
            document.getElementById('val-brake').innerText = "60";
            document.getElementById('slider-traffic').value = 20;
            document.getElementById('val-traffic').innerText = "20";
            document.getElementById('slider-collision').value = 80;
            document.getElementById('val-collision').innerText = "80";

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 150, 1200);

            camera1 = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
            camera2 = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
            menuCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
            rearCamera1 = new THREE.PerspectiveCamera(30, 3 / 1, 0.1, 1500);
            rearCamera2 = new THREE.PerspectiveCamera(30, 3 / 1, 0.1, 1500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.autoClear = false; 
            document.body.appendChild(renderer.domElement);

            ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(-50, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);
            scene.add(dirLight.target);

        function setupNextTunnel(startZ) {
            if (!tunnelGroup) return; 
            currentTunnelZ = startZ;
            let segmentsCount = 2 + Math.floor(Math.random() * 19); 
            currentTunnelLength = segmentsCount * 100;
            tunnelGroup.position.set(0, 0, currentTunnelZ); 
            
            for(let i=0; i<20; i++) {
                if(tunnelGroup.children[i]) {
                    tunnelGroup.children[i].visible = (i < segmentsCount);
                }
            }
            tunnelGroup.position.y = 0;
        }

        function checkVisibility(obj, z) {
            if (!obj) return; 
            let margin = 10;
            if (z < currentTunnelZ + margin && z > currentTunnelZ - currentTunnelLength - margin) {
                obj.visible = false;
            } else {
                obj.visible = true;
            }
        }

        function resetDecor(baseZ) {
            let spawnDistance = 600 + Math.random() * 7400;
            setupNextTunnel(baseZ - spawnDistance);

            for (let i = 0; i < DECOR.lightCount; i++) {
                if (!lightsLeft[i]) continue; 
                let z = baseZ - (i * DECOR.lightSpacing);
                lightsLeft[i].position.set(-12, 0, z);
                lightsRight[i].position.set(12, 0, z);
                checkVisibility(lightsLeft[i], z);
                checkVisibility(lightsRight[i], z);
            }

            const treeSpan = 1200;
            for (let i = 0; i < DECOR.treeCount; i++) {
                if (!trees[i]) continue;
                let side = Math.random() > 0.5 ? 1 : -1;
                let x = side * (15 + Math.random() * 45);
                let z = baseZ - Math.random() * treeSpan;
                trees[i].position.set(x, 0, z);
                checkVisibility(trees[i], z);
            }

            const buildSpan = 2000;
            for (let i = 0; i < DECOR.buildingCount; i++) {
                if (!buildings[i]) continue;
                let side = Math.random() > 0.5 ? 1 : -1;
                let x = side * (80 + Math.random() * 150); 
                let z = baseZ + 200 - Math.random() * buildSpan;
                buildings[i].position.set(x, buildings[i].position.y, z);
                checkVisibility(buildings[i], z);
            }

            const mountSpan = 1500;
            for (let i = 0; i < DECOR.mountainCount; i++) {
                if (!mountains[i]) continue;
                let side = Math.random() > 0.5 ? 1 : -1;
                let x = side * (450 + Math.random() * 200);
                let z = baseZ + 200 - Math.random() * mountSpan;
                mountains[i].position.set(x, mountains[i].position.y, z);
            }
        }

        function updateDecor(trailZ, leadZ) {
            let limitZ = trailZ + 100; 

            if ((currentTunnelZ - currentTunnelLength) > limitZ) {
                let spawnDistance = 600 + Math.random() * 7400; 
                setupNextTunnel(leadZ - spawnDistance);
            }

            let cycleLight = DECOR.lightCount * DECOR.lightSpacing;
            for (let i = 0; i < DECOR.lightCount; i++) {
                if (!lightsLeft[i]) continue; 
                if (lightsLeft[i].position.z > limitZ) {
                    lightsLeft[i].position.z -= cycleLight;
                    lightsRight[i].position.z -= cycleLight;
                }
                checkVisibility(lightsLeft[i], lightsLeft[i].position.z);
                checkVisibility(lightsRight[i], lightsRight[i].position.z);
            }

            const treeSpan = 1200;
            for (let i = 0; i < DECOR.treeCount; i++) {
                if (!trees[i]) continue;
                if (trees[i].position.z > limitZ) {
                    let side = Math.random() > 0.5 ? 1 : -1;
                    trees[i].position.x = side * (15 + Math.random() * 45);
                    trees[i].position.z -= treeSpan;
                }
                checkVisibility(trees[i], trees[i].position.z);
            }

            const buildSpan = 2000;
            for (let i = 0; i < DECOR.buildingCount; i++) {
                if (!buildings[i]) continue;
                if (buildings[i].position.z > limitZ) {
                    let side = Math.random() > 0.5 ? 1 : -1;
                    buildings[i].position.x = side * (80 + Math.random() * 150);
                    buildings[i].position.z -= buildSpan;
                }
                checkVisibility(buildings[i], buildings[i].position.z);
            }

            const mountSpan = 1500;
            for (let i = 0; i < DECOR.mountainCount; i++) {
                if (!mountains[i]) continue;
                if (mountains[i].position.z > limitZ + 200) { 
                    let side = Math.random() > 0.5 ? 1 : -1;
                    mountains[i].position.x = side * (450 + Math.random() * 200);
                    mountains[i].position.z -= mountSpan;
                }
            }
        }

        function onWindowResize() {
            let w = window.innerWidth;
            let h = window.innerHeight;

            renderer.setSize(w, h);
            
            menuCamera.aspect = w / h;
            menuCamera.updateProjectionMatrix();
            
            if (numPlayers === 1) {
                if(camera1 && rearCamera1) {
                    camera1.aspect = w / h;

                    rearCamera1.aspect = (w * 0.3) / (w * 0.1);
                    rearCamera1.updateProjectionMatrix();
                    rearCamera1.projectionMatrix.elements[0] *= -1;

                if(camera1 && camera2 && rearCamera1 && rearCamera2) {
                    camera1.aspect = (w / 2) / h;
                    camera1.updateProjectionMatrix();
                    camera2.aspect = (w / 2) / h;
                    camera2.updateProjectionMatrix();
                    rearCamera1.aspect = (w * 0.2) / (w * 0.0666);
                    rearCamera1.updateProjectionMatrix();

                    rearCamera2.aspect = (w * 0.2) / (w * 0.0666);
                    rearCamera2.updateProjectionMatrix();
                    rearCamera2.projectionMatrix.elements[0] *= -1; 
                }
            }
        }

        class TrafficCar {
            constructor() {
                this.group = new THREE.Group();
                this.box = new THREE.Box3(); 
                this.assignLaneAndSpeed();
                this.absoluteZ = 0;
                this.state = 'idle'; this.blinkerState = 'none'; this.prepTimer = 0; this.cooldownTimer = 2.0;

                const color = CONFIG.COLORS[Math.floor(Math.random() * CONFIG.COLORS.length)];
                const body = new THREE.Mesh(new THREE.BoxGeometry(CONFIG.TRAFFIC_WIDTH, 1.2, CONFIG.TRAFFIC_LENGTH), new THREE.MeshLambertMaterial({ color: color, side: THREE.DoubleSide }));
                body.position.y = 0.6; body.castShadow = true; this.group.add(body);

                this.leftBlinkerMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0, side: THREE.DoubleSide });
                this.rightBlinkerMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0, side: THREE.DoubleSide });
                this.brakeMat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0, side: THREE.DoubleSide });
                
                this.headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1, side: THREE.DoubleSide });

                const blinkerGeo = new THREE.BoxGeometry(0.4, 0.3, 0.1);
                const leftBlinker = new THREE.Mesh(blinkerGeo, this.leftBlinkerMat); leftBlinker.position.set(-CONFIG.TRAFFIC_WIDTH / 2 + 0.3, 0.6, CONFIG.TRAFFIC_LENGTH / 2 + 0.06); this.group.add(leftBlinker);
                const rightBlinker = new THREE.Mesh(blinkerGeo, this.rightBlinkerMat); rightBlinker.position.set(CONFIG.TRAFFIC_WIDTH / 2 - 0.3, 0.6, CONFIG.TRAFFIC_LENGTH / 2 + 0.06); this.group.add(rightBlinker);

                const brakeGeo = new THREE.BoxGeometry(0.8, 0.3, 0.1);
                const leftBrake = new THREE.Mesh(brakeGeo, this.brakeMat); leftBrake.position.set(-0.7, 0.6, CONFIG.TRAFFIC_LENGTH / 2 + 0.06); this.group.add(leftBrake);
                const rightBrake = new THREE.Mesh(brakeGeo, this.brakeMat); rightBrake.position.set(0.7, 0.6, CONFIG.TRAFFIC_LENGTH / 2 + 0.06); this.group.add(rightBrake);
                
                const hlGeo = new THREE.BoxGeometry(0.7, 0.3, 0.1);
                const leftHl = new THREE.Mesh(hlGeo, this.headlightMat); leftHl.position.set(-1.0, 0.6, -2.56); this.group.add(leftHl);
                const rightHl = new THREE.Mesh(hlGeo, this.headlightMat); rightHl.position.set(1.0, 0.6, -2.56); this.group.add(rightHl);

                scene.add(this.group);
            }

            assignLaneAndSpeed() {
                this.state = 'idle'; this.blinkerState = 'none'; this.prepTimer = 0; this.cooldownTimer = 3.0;
                this.passed = false; 
                const spawnLanes = [0, 1, 2];
                this.lane = spawnLanes[Math.floor(Math.random() * spawnLanes.length)];
                this.targetLane = this.lane;
                
                let minKmh, maxKmh;
                if (this.lane === 0) { minKmh = 120; maxKmh = 160; } 
                else if (this.lane === 1) { minKmh = 90; maxKmh = 130; } 
                else { minKmh = 70; maxKmh = 100; }
                
                if (Math.random() < 0.10) { minKmh -= 15; maxKmh += 20; }

                this.baseKmh = minKmh + Math.random() * (maxKmh - minKmh);
                this.baseSpeed = this.baseKmh * CONFIG.SPEED_MULTIPLIER;
                this.currentSpeed = this.baseSpeed;
                this.group.position.x = LANE_CENTERS[this.lane];
            }

            checkLaneFree(targetLaneIndex, leadZ) {
                for (let other of trafficArray) {
                    if (other === this) continue;
                    if (other.lane === targetLaneIndex || other.targetLane === targetLaneIndex) {
                        if (Math.abs(other.absoluteZ - this.absoluteZ) < CONFIG.LANE_MARGIN) return false;
                    }
                }
                
                let targetLaneX = LANE_CENTERS[targetLaneIndex];
                let checkPlayer = (p) => {
                    if(gameState === 'menu') return true; 
                    if(p && !p.isDead && Math.abs(p.group.position.x - targetLaneX) < (CONFIG.LANE_WIDTH / 2 + 1.5)) {
                        if (Math.abs(p.absoluteZ - this.absoluteZ) < CONFIG.LANE_MARGIN) return false;
                    }
                    return true;
                };

                if (!checkPlayer(p1)) return false;
                if (numPlayers === 2 && !checkPlayer(p2)) return false;
                return true;
            }

            update(delta, currentTime, leadZ, isNight) { 
                let distAhead = Infinity;
                let speedAhead = this.baseSpeed;
                let relevantLane = (this.state === 'idle') ? this.lane : this.targetLane;
                let isBraking = false; 

                for (let other of trafficArray) {
                    if (other === this) continue;
                    if (other.lane === relevantLane || other.targetLane === relevantLane) {
                        let d = this.absoluteZ - other.absoluteZ; 
                        if (d > 0 && d < distAhead) {
                            distAhead = d; speedAhead = other.currentSpeed;
                        }
                    }
                }

                if (gameState !== 'menu') {
                    let checkPlayerFront = (p) => {
                        if (p && !p.isDead) { 
                            let dist = this.absoluteZ - p.absoluteZ;
                            if (dist > 0 && dist < distAhead) {
                                let relevantLaneX = LANE_CENTERS[relevantLane];
                                if (Math.abs(p.group.position.x - relevantLaneX) < (CONFIG.LANE_WIDTH / 2 + 1.0)) {
                                    distAhead = dist; speedAhead = p.currentKmh * CONFIG.SPEED_MULTIPLIER;
                                }
                            }
                        }
                    };
                    checkPlayerFront(p1);
                    if (numPlayers === 2) checkPlayerFront(p2);
                }

                if (this.cooldownTimer > 0) this.cooldownTimer -= delta;

                if (this.state === 'idle') {
                    let isBlocked = (distAhead < CONFIG.SAFE_DISTANCE && this.currentSpeed > speedAhead);
                    if (isBlocked) {
                        if (this.cooldownTimer <= 0 && this.lane > 0 && this.checkLaneFree(this.lane - 1, leadZ)) {
                            this.targetLane = this.lane - 1; this.blinkerState = 'left';
                            this.state = 'preparing'; this.prepTimer = CONFIG.BLINKER_DELAY;
                        } else {
                            this.currentSpeed = Math.max(this.currentSpeed - 50 * delta, speedAhead);
                            isBraking = true; 
                        }
                    } else {
                        if (this.currentSpeed < this.baseSpeed) this.currentSpeed = Math.min(this.currentSpeed + 15 * delta, this.baseSpeed);
                        if (this.cooldownTimer <= 0 && this.lane < CONFIG.LANE_COUNT - 1 && Math.random() < 0.005) {
                            if (this.checkLaneFree(this.lane + 1, leadZ)) {
                                this.targetLane = this.lane + 1; this.blinkerState = 'right';
                                this.state = 'preparing'; this.prepTimer = CONFIG.BLINKER_DELAY;
                            }
                        }
                    }
                } else if (this.state === 'preparing') {
                    this.prepTimer -= delta;
                    if (distAhead < CONFIG.SAFE_DISTANCE && this.currentSpeed > speedAhead) {
                        this.currentSpeed = Math.max(this.currentSpeed - 50 * delta, speedAhead);
                        isBraking = true;
                    }
                    if (this.prepTimer <= 0) {
                        if (this.checkLaneFree(this.targetLane, leadZ)) {
                            this.state = 'changing';
                        } else {
                            this.state = 'idle'; this.blinkerState = 'none'; this.targetLane = this.lane; this.cooldownTimer = 2.0; 
                        }
                    }
                } else if (this.state === 'changing') {
                    const targetX = LANE_CENTERS[this.targetLane];
                    const currentX = this.group.position.x;
                    if (currentX < targetX) this.group.position.x = Math.min(currentX + CONFIG.CHANGE_LANE_SPEED * delta, targetX);
                    else this.group.position.x = Math.max(currentX - CONFIG.CHANGE_LANE_SPEED * delta, targetX);

                    if (Math.abs(this.group.position.x - targetX) < 0.1) {
                        this.group.position.x = targetX; this.lane = this.targetLane;
                        this.state = 'idle'; this.blinkerState = 'none'; this.cooldownTimer = CONFIG.COOLDOWN_DELAY; 
                    }
                }

                this.absoluteZ -= this.currentSpeed * delta;
                
                const isBlinking = (currentTime % 600) < 300;
                this.leftBlinkerMat.opacity = (this.blinkerState === 'left' && isBlinking) ? 1 : 0;
                this.rightBlinkerMat.opacity = (this.blinkerState === 'right' && isBlinking) ? 1 : 0;
                
                this.brakeMat.opacity = isBraking ? 1 : (isNight ? 0.4 : 0); 
                if (this.headlightMat) this.headlightMat.opacity = isNight ? 0.6 : 0.1;
                
                this.group.position.z = this.absoluteZ;
            }
        }

        function getSafeSpawnZ(leadZ) {
            let spawnRangeStart = -30;
            let spawnRangeEnd = -CONFIG.ROAD_LENGTH * 0.8;
            let spacing = (spawnRangeStart - spawnRangeEnd) / Math.max(configTraffic, 1);
            
            let baseZ = leadZ + spawnRangeEnd;
            let safeZ = baseZ - Math.random() * spacing * 6;

            let attempts = 0;
            while(attempts < 10) {
               let isSafe = true;
               for(let other of trafficArray) {
                   if (Math.abs(other.absoluteZ - safeZ) < spacing * 0.8) {
                       isSafe = false; safeZ -= spacing; break;
                  }
               }
               if (isSafe) break;
               attempts++;
            }
            return safeZ;
        }

        function updatePlayerPhysics(p, delta, currentTime, isNight) {
            if (!p || p.isDead) return;

            let turnRatio = Math.min(1.0, Math.max(0.1, p.currentKmh / 60));
            let actualLateralSpeed = (25 * (configHandling / 50)) * turnRatio;
            let isBraking = false;
            
            let isFlashingNow = keys[p.keys.flash];
            p.justFlashed = isFlashingNow && !p.flashPressed;
            p.flashPressed = isFlashingNow;

            let isGearDownNow = keys[p.keys.gearDown];
            if (isGearDownNow && !p.gearDownPressed && p.gear > 1) {
                let lowerGearMax = GEAR_LIMITS[p.gear - 1];
                if (p.currentKmh <= lowerGearMax + 10) {
                    p.gear--;
                    p.sounds.down.currentTime = 0; p.sounds.down.play().catch(e=>{});
                }
            }
            p.gearDownPressed = isGearDownNow;

            let isGearUpNow = keys[p.keys.gearUp];
            if (isGearUpNow && !p.gearUpPressed && p.gear < 6) {
                p.gear++;
                p.sounds.up.currentTime = 0; p.sounds.up.play().catch(e=>{});
            }
            p.gearUpPressed = isGearUpNow;

            // --- PHYSIQUE RÉALISTE NEWTONIENNE ---
            let mass = 1750; 
            let v_ms = p.currentKmh / 3.6; 
            
            let targetMaxKmh = GEAR_LIMITS[p.gear];
            let rpm = 1000 + (p.currentKmh / targetMaxKmh) * 6000; 
            rpm = Math.max(1000, rpm); 

            let gearRatio = 315 / targetMaxKmh;

            let forceAero = 0.366 * v_ms * v_ms; 
            let forceRoll = 257; 
            let forceResist = forceAero + forceRoll;

            p.isLimiting = false; 

            if (!keys[p.keys.up] && p.wasAccelerating && rpm >= 4000 && rpm <= 7000) {
                p.sounds.backfire.currentTime = 0;
                p.sounds.backfire.play().catch(e=>{});
            }

            if (keys[p.keys.up]) {
                let ratio = p.currentKmh / targetMaxKmh;
                if (ratio >= 0.98) { 
                    // Baisse en pourcentage pour rester verrouillé dans la zone rouge
                    p.currentKmh = targetMaxKmh * 0.985; 
                    rpm = 7000 + Math.random() * 250; 
                    p.isLimiting = true; 
                } else {
                    let torque = 500;
                    if (rpm < 3000) torque = 500 + ((rpm - 1000) / 2000) * 300; 
                    else if (rpm < 5000) torque = 800 + ((rpm - 3000) / 2000) * 50; 
                    else torque = 850 - ((rpm - 5000) / 2000) * 300; 

                    let forceEngine = (torque * gearRatio * 3.5 * (configAccel / 50)) / 0.35; 
                    let accel_ms2 = (forceEngine - forceResist) / mass;
                    if (accel_ms2 < 0) accel_ms2 = 0; 

                    p.currentKmh += (accel_ms2 * 3.6) * delta;
                }
                p.warningsActive = false;
            } else if (keys[p.keys.down]) {
                // CORRECTION DU FREINAGE : La force brute est de retour !
                let brakeForce = 75000 * (configBrake / 50); 
                let decel_ms2 = (brakeForce + forceResist) / mass;
                p.currentKmh -= (decel_ms2 * 3.6) * delta;
                
                isBraking = true;
                p.brakeTimer += delta;
                if (p.brakeTimer > 0.15) p.warningsActive = true;
            } else {
                let engineFrictionTorque = 40 + (rpm * 0.025); 
                let forceEngineBrake = (engineFrictionTorque * gearRatio * 3.5) / 0.35;
                
                let decel_ms2 = (forceEngineBrake + forceResist) / mass;
                if (p.currentKmh > 0) {
                    p.currentKmh -= (decel_ms2 * 3.6) * delta;
                }
                
                p.brakeTimer = 0; p.warningsActive = false; 
            }
            
            p.currentKmh = Math.max(0, p.currentKmh);
            p.absoluteZ -= (p.currentKmh * CONFIG.SPEED_MULTIPLIER) * delta;
            p.score += (p.currentKmh / 100) * (delta * 10);

            if (keys[p.keys.left]) p.group.position.x -= actualLateralSpeed * delta;
            if (keys[p.keys.right]) p.group.position.x += actualLateralSpeed * delta;
            
            const maxL = LANE_CENTERS[0] - 1.5; const maxR = LANE_CENTERS[CONFIG.LANE_COUNT - 1] + 1.5;
            p.group.position.x = Math.max(maxL, Math.min(maxR, p.group.position.x));
            p.group.position.z = p.absoluteZ;

            p.box.setFromObject(p.group);
            p.box.expandByScalar(-0.1); 

            const isFastBlinking = (currentTime % 150) < 75; 
            
            p.brakeMat.opacity = isBraking ? 1 : (isNight ? 0.4 : 0);
            p.leftBlinkMat.opacity = (p.warningsActive && isFastBlinking) ? 1 : 0;
            p.rightBlinkMat.opacity = (p.warningsActive && isFastBlinking) ? 1 : 0;

            p.headlightMat.opacity = isFlashingNow ? 1.0 : (isNight ? 0.6 : 0.1);
            p.spotLight.intensity = isFlashingNow ? (isNight ? 8.0 : 3.0) : (isNight ? 3.0 : 0); 

            rpm = Math.max(1000, Math.min(8000, rpm)); 
            
            if(document.getElementById(`speed-p${p.id}`)) document.getElementById(`speed-p${p.id}`).innerText = Math.floor(p.currentKmh);
            if(document.getElementById(`score-p${p.id}`)) document.getElementById(`score-p${p.id}`).innerText = Math.floor(p.score);
            if(document.getElementById(`gear-p${p.id}`)) document.getElementById(`gear-p${p.id}`).innerText = p.gear;
            
            let rotation = -135 + (rpm / 8000) * 270;
            if(document.getElementById(`needle-p${p.id}`)) document.getElementById(`needle-p${p.id}`).style.transform = `translateX(-50%) rotate(${rotation}deg)`;

            // --- AUDIO MOTEUR & RUPTEUR RÉPARÉ ---
            let pitch = 0.6 + (rpm / 8000) * 1.6;
            p.sounds.engine.playbackRate = Math.max(0.1, Math.min(pitch, 3.0));

            if (p.isLimiting) {
                if (p.sounds.revlimit.paused) {
                    p.sounds.revlimit.currentTime = 0; 
                    p.sounds.revlimit.play().catch(e=>{});
                }
                p.sounds.engine.volume = 0; 
            } else {
                if (!p.sounds.revlimit.paused) {
                    p.sounds.revlimit.pause();
                    p.sounds.revlimit.currentTime = 0; 
                }
                // Si on appuie sur l'accélérateur, le son est fort (0.4)
                // Sinon on baisse le son pour simuler la roue libre / décélération (0.15)
                if (keys[p.keys.up]) {
                    p.sounds.engine.volume = 0.4; 
                } else {
                    p.sounds.engine.volume = 0.15; 
                }
            }

            p.wasAccelerating = keys[p.keys.up];
        }

        function positionRoadLinesForCamera(cam) {
            let camGridZ = Math.floor(cam.position.z / 10) * 10;
            roadLines.forEach((line, i) => {
                let laneIdx = i % (CONFIG.LANE_COUNT - 1);
                let lineIdx = Math.floor(i / (CONFIG.LANE_COUNT - 1));
                let lineX = -TOTAL_ROAD_WIDTH / 2 + ((laneIdx + 1) * CONFIG.LANE_WIDTH);
                let relZ = (lineIdx * 10);
                line.position.set(lineX, 0.02, camGridZ - relZ + 100);
            });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1); 
            const currentTime = Date.now();

            let timeOfDay = (currentTime % 240000) / 240000 * Math.PI * 2;
            let sunHeight = Math.sin(timeOfDay); 
            let daylight = Math.max(0, Math.min(1, sunHeight + 0.3)); 
            let isNight = daylight < 0.3;

            const nightColor = new THREE.Color(0x020208);
            const dayColor = new THREE.Color(0x87CEEB);
            scene.background.copy(nightColor).lerp(dayColor, daylight);
            scene.fog.color.copy(scene.background);

            if(ambientLight) ambientLight.intensity = 0.2 + (daylight * 0.4);
            if(dirLight) dirLight.intensity = daylight * 0.8;

            if (streetLightMat) {
                streetLightMat.color.setHex(isNight ? 0xf1c40f : 0x555555);
            }

            if (gameState === 'menu') {
                if(menuCamera) {
                    menuCamera.position.set(13, 5, 40); 
                    menuCamera.lookAt(-2, 1, -60);
                }

                if(ground) ground.position.z = 0;
                if(road) road.position.z = 0;
                if(dirLight) {
                    dirLight.position.z = 50;
                    dirLight.target.position.z = 0;
                }

                let spacing = 400 / Math.max(CONFIG.TRAFFIC_COUNT, 1);

                for (let i = trafficArray.length - 1; i >= 0; i--) {
                    const car = trafficArray[i];
                    car.update(delta, currentTime, 0, isNight); 
                    
                    if (car.absoluteZ < -250) {
                        let maxZ = 50;
                        for(let t of trafficArray) {
                            if(t.absoluteZ > maxZ) maxZ = t.absoluteZ;
                        }
                        car.absoluteZ = maxZ + spacing;
                        car.assignLaneAndSpeed();
                    }
                }

                updateDecor(0, 0); 

                if(menuCamera) positionRoadLinesForCamera(menuCamera);
                if(renderer) {
                    renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                    renderer.setScissor(0, 0, window.innerWidth, window.innerHeight);
                    renderer.setScissorTest(true);
                    renderer.clear();
                    renderer.render(scene, menuCamera);
                }
                return; 
            }

            if (gameState === 'countdown') {
                countdownTimer -= delta;
                let text = Math.floor(countdownTimer);
                if (text === 0) text = "GO !";
                if(document.getElementById('countdown-text')) document.getElementById('countdown-text').innerText = text;
                
                if (countdownTimer <= 0) {
                    if(countdownOverlay) countdownOverlay.classList.add('hidden');
                    gameState = 'playing';
                }
            }

            if (gameState === 'playing' || gameState === 'gameover') {
                if (gameState === 'playing') {
                    updatePlayerPhysics(p1, delta, currentTime, isNight);
                    if (numPlayers === 2) updatePlayerPhysics(p2, delta, currentTime, isNight);

                    if (numPlayers === 2 && !p1.isDead && !p2.isDead) {
                        
                        if (p1.box.intersectsBox(p2.box)) {
                            let dx = p1.group.position.x - p2.group.position.x;
                            let dz = p1.absoluteZ - p2.absoluteZ;
                            
                            const maxL = LANE_CENTERS[0] - 1.5; 
                            const maxR = LANE_CENTERS[CONFIG.LANE_COUNT - 1] + 1.5;

                            if (Math.abs(dx) > 1.8) { 
                                if (dx === 0) dx = 0.1;
                                
                                let overlap = 3.6 - Math.abs(dx);
                                if (overlap > 0) {
                                    let push = overlap / 2;
                                    if (dx > 0) { p1.group.position.x += push; p2.group.position.x -= push; } 
                                    else { p1.group.position.x -= push; p2.group.position.x += push; }
                                }
                                
                                p1.group.position.x = Math.max(maxL, Math.min(maxR, p1.group.position.x));
                                p2.group.position.x = Math.max(maxL, Math.min(maxR, p2.group.position.x));

                                let newDx = p1.group.position.x - p2.group.position.x;
                                if (Math.abs(newDx) < 3.6) {
                                    if (newDx >= 0) { 
                                        if (p1.group.position.x >= maxR) p2.group.position.x = maxR - 3.6;
                                        else if (p2.group.position.x <= maxL) p1.group.position.x = maxL + 3.6;
                                    } else { 
                                        if (p2.group.position.x >= maxR) p1.group.position.x = maxR - 3.6;
                                        else if (p1.group.position.x <= maxL) p2.group.position.x = maxL + 3.6;
                                    }
                                }
                            } else { 
                                let speedDiff = Math.abs(p1.currentKmh - p2.currentKmh);
                                
                                let basePower = configCollision * 0.2; 
                                let diffMult = 0.1 + (configCollision / 100) * 0.9; 
                                let pushZ = 0.5 + (configCollision / 100) * 2.5; 
                                
                                let boost = basePower + (speedDiff * diffMult); 
                                let brake = basePower + (speedDiff * diffMult); 
                                
                                if (dz > 0) { 
                                    p1.currentKmh = Math.max(0, p1.currentKmh - brake); 
                                    p2.currentKmh = Math.min(CONFIG.MAX_KMH, p2.currentKmh + boost); 
                                    p1.absoluteZ += pushZ; 
                                } else { 
                                    p2.currentKmh = Math.max(0, p2.currentKmh - brake);
                                    p1.currentKmh = Math.min(CONFIG.MAX_KMH, p1.currentKmh + boost);
                                    p2.absoluteZ += pushZ; 
                                }
                                
                                p1.group.position.x = Math.max(maxL, Math.min(maxR, p1.group.position.x));
                                p2.group.position.x = Math.max(maxL, Math.min(maxR, p2.group.position.x));
                            }
                            
                            p1.box.setFromObject(p1.group);
                            p1.box.expandByScalar(-0.1);
                            p2.box.setFromObject(p2.group);
                            p2.box.expandByScalar(-0.1);
                        }
                        
                        let dist = p1.absoluteZ - p2.absoluteZ;
                        if (dist > CONFIG.MAX_SEPARATION) {
                            p1.isDead = true;
                            triggerGameOver(`TEMPÊTE ! ${p2.name.toUpperCase()} GAGNE !`, playerColor2);
                        } else if (dist < -CONFIG.MAX_SEPARATION) {
                            p2.isDead = true;
                            triggerGameOver(`TEMPÊTE ! ${p1.name.toUpperCase()} GAGNE !`, playerColor1);
                        }
                        
                        let lateralDist = Math.abs(p1.group.position.x - p2.group.position.x);
                        if (lateralDist < 3.0) { 
                            let dist1to2 = p1.absoluteZ - p2.absoluteZ; 
                            let dist2to1 = p2.absoluteZ - p1.absoluteZ; 
                            
                            if (p1.justFlashed && dist1to2 > 0 && dist1to2 < 20) p2.blindOpacity = 1.0;
                            if (p2.justFlashed && dist2to1 > 0 && dist2to1 < 20) p1.blindOpacity = 1.0;
                        }
                    }
                }

                if (p1 && !p1.isDead) {
                    p1.blindOpacity = Math.max(0, p1.blindOpacity - delta * 3);
                    if(flashP1) flashP1.style.opacity = p1.blindOpacity;
                }
                if (numPlayers === 2 && p2 && !p2.isDead) {
                    p2.blindOpacity = Math.max(0, p2.blindOpacity - delta * 3);
                    if(flashP2) flashP2.style.opacity = p2.blindOpacity;
                }

                let leadZ = 0;
                let trailZ = 0;
                if (numPlayers === 1) {
                    leadZ = trailZ = p1.absoluteZ;
                } else {
                    if (p1.isDead) leadZ = trailZ = p2.absoluteZ;
                    else if (p2.isDead) leadZ = trailZ = p1.absoluteZ;
                    else {
                        leadZ = Math.min(p1.absoluteZ, p2.absoluteZ); 
                        trailZ = Math.max(p1.absoluteZ, p2.absoluteZ); 
                    }
                }

                let activeZ = (leadZ + trailZ) / 2;

                updateDecor(trailZ, leadZ);

                if (ground && road) {
                    ground.position.z = activeZ;
                    road.position.z = activeZ;
                }
                if (dirLight) {
                    dirLight.position.z = activeZ + 50;
                    dirLight.target.position.z = activeZ;
                }

                for (let i = trafficArray.length - 1; i >= 0; i--) {
                    const car = trafficArray[i];
                    if (gameState === 'playing') {
                        car.update(delta, currentTime, leadZ, isNight);
                    }

                    let distBehindTrail = car.absoluteZ - trailZ; 
                    let distAheadLead = car.absoluteZ - leadZ; 

                    if (distBehindTrail > 60 || distAheadLead < -CONFIG.ROAD_LENGTH * 1.5) {
                        car.absoluteZ = getSafeSpawnZ(leadZ);
                        car.assignLaneAndSpeed();
                    }

                    car.box.setFromObject(car.group);
                    car.box.expandByScalar(-0.1); 

                    if (gameState === 'playing') {
                        // AUDIO EFFET WHOOSH
                        let distToP1 = car.absoluteZ - p1.absoluteZ;
                        if (distToP1 < 5 && distToP1 > -15 && !car.passed && !p1.isDead) {
                            let latDist = Math.abs(car.group.position.x - p1.group.position.x);
                            if (latDist > 2.0 && latDist < 8.0 && Math.abs(p1.currentKmh - car.currentSpeed/CONFIG.SPEED_MULTIPLIER) > 80) {
                                let w = soundWhoosh.cloneNode();
                                w.play().catch(e=>{});
                            }
                            car.passed = true;
                        }

                        if (numPlayers === 2 && !p2.isDead) {
                            let distToP2 = car.absoluteZ - p2.absoluteZ;
                            if (distToP2 < 5 && distToP2 > -15 && !car.passed) {
                                let latDist = Math.abs(car.group.position.x - p2.group.position.x);
                                if (latDist > 2.0 && latDist < 8.0 && Math.abs(p2.currentKmh - car.currentSpeed/CONFIG.SPEED_MULTIPLIER) > 80) {
                                    let w = soundWhoosh.cloneNode();
                                    w.play().catch(e=>{});
                                }
                                car.passed = true;
                            }
                        }

                        if (!p1.isDead && p1.box.intersectsBox(car.box)) {
                            p1.isDead = true;
                            if (numPlayers === 1) triggerGameOver("CRASH !");
                            else if (p2.isDead) triggerGameOver("TOUT LE MONDE EST CRASHÉ !");
                            else triggerGameOver(`ACCIDENT ! ${p2.name.toUpperCase()} GAGNE !`, playerColor2);
                        }
                        if (numPlayers === 2 && !p2.isDead && p2.box.intersectsBox(car.box)) {
                            p2.isDead = true;
                            if (p1.isDead) triggerGameOver("TOUT LE MONDE EST CRASHÉ !");
                            else triggerGameOver(`ACCIDENT ! ${p1.name.toUpperCase()} GAGNE !`, playerColor1);
                        }
                    }
                }
            }

            if(renderer) renderer.clear(); 
            
            if (p1 && p1.group && camera1) {
                camera1.position.x += (p1.group.position.x - camera1.position.x) * 0.1;
                camera1.position.y = 8; 
                camera1.position.z = p1.group.position.z + 20; 
                camera1.lookAt(p1.group.position.x, 0, p1.group.position.z - 40);
                let targetFov = 60 + (p1.currentKmh / CONFIG.MAX_KMH) * 20;
                if (Math.abs(camera1.fov - targetFov) > 0.5) { camera1.fov += (targetFov - camera1.fov) * 0.1; camera1.updateProjectionMatrix(); }
            }

            if (numPlayers === 2 && p2 && p2.group && camera2) {
                camera2.position.x += (p2.group.position.x - camera2.position.x) * 0.1;
                camera2.position.y = 8; 
                camera2.position.z = p2.group.position.z + 20; 
                camera2.lookAt(p2.group.position.x, 0, p2.group.position.z - 40);
                let targetFov = 60 + (p2.currentKmh / CONFIG.MAX_KMH) * 20;
                if (Math.abs(camera2.fov - targetFov) > 0.5) { camera2.fov += (targetFov - camera2.fov) * 0.1; camera2.updateProjectionMatrix(); }
            }

            if (numPlayers === 1) {
                if(camera1 && renderer) {
                    positionRoadLinesForCamera(camera1);
                    renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                    renderer.setScissor(0, 0, window.innerWidth, window.innerHeight);
                    renderer.setScissorTest(true);
                    renderer.render(scene, camera1);
                }

                if (gameState === 'playing' && p1 && !p1.isDead && rearCamera1 && renderer) {
                    let mirrorW = window.innerWidth * 0.3; let mirrorH = window.innerWidth * 0.1; 
                    let mirrorX = (window.innerWidth - mirrorW) / 2; let mirrorY = window.innerHeight - 20 - mirrorH; 

                    rearCamera1.position.set(p1.group.position.x, 3, p1.group.position.z - 2);
                    rearCamera1.lookAt(p1.group.position.x, 3, p1.group.position.z + 100);

                    renderer.setViewport(mirrorX, mirrorY, mirrorW, mirrorH);
                    renderer.setScissor(mirrorX, mirrorY, mirrorW, mirrorH);
                    renderer.render(scene, rearCamera1);
                }
            } else {
                if(camera1 && camera2 && renderer) {
                    positionRoadLinesForCamera(camera1);
                    renderer.setViewport(0, 0, window.innerWidth / 2, window.innerHeight);
                    renderer.setScissor(0, 0, window.innerWidth / 2, window.innerHeight);
                    renderer.setScissorTest(true);
                    renderer.render(scene, camera1);
                    
                    positionRoadLinesForCamera(camera2);
                    renderer.setViewport(window.innerWidth / 2, 0, window.innerWidth / 2, window.innerHeight);
                    renderer.setScissor(window.innerWidth / 2, 0, window.innerWidth / 2, window.innerHeight);
                    renderer.setScissorTest(true);
                    renderer.render(scene, camera2);
                }

                if (gameState === 'playing') {
                    if (p1 && !p1.isDead && rearCamera1 && renderer) {
                        let mirrorW = window.innerWidth * 0.2; let mirrorH = window.innerWidth * 0.0666; 
                        let mirrorX1 = (window.innerWidth * 0.25) - (mirrorW / 2); let mirrorY = window.innerHeight - 20 - mirrorH; 

                        rearCamera1.position.set(p1.group.position.x, 3, p1.group.position.z - 2);
                        rearCamera1.lookAt(p1.group.position.x, 3, p1.group.position.z + 100);
                        renderer.setViewport(mirrorX1, mirrorY, mirrorW, mirrorH);
                        renderer.setScissor(mirrorX1, mirrorY, mirrorW, mirrorH);
                        renderer.render(scene, rearCamera1);
                    }

                    if (p2 && !p2.isDead && rearCamera2 && renderer) {
                        let mirrorW = window.innerWidth * 0.2; let mirrorH = window.innerWidth * 0.0666; 
                        let mirrorX2 = (window.innerWidth * 0.75) - (mirrorW / 2); let mirrorY = window.innerHeight - 20 - mirrorH; 
                        rearCamera2.position.set(p2.group.position.x, 3, p2.group.position.z - 2);
                        rearCamera2.lookAt(p2.group.position.x, 3, p2.group.position.z + 100);
                        renderer.setViewport(mirrorX2, mirrorY, mirrorW, mirrorH);
                        renderer.setScissor(mirrorX2, mirrorY, mirrorW, mirrorH);
                        renderer.render(scene, rearCamera2);
                    }
                }
            }
        }

        init(); animate();
    </script>
</body>
</html>
